# ============================================================
# GTX Rush — Production Docker Compose
# ============================================================
# Usage: docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  # --- API Server ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtx-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gtx-network

  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: gtx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gtx_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gtx_rush
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtx_user -d gtx_rush"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gtx-network

  # --- Redis Cache ---
  redis:
    image: redis:7-alpine
    container_name: gtx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gtx-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gtx-network:
    driver: bridge
